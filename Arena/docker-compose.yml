services:
  mysql-user:
    image: mysql:8.0
    container_name: arena-mysql-user
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_user_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-user-data:/var/lib/mysql
      - ./services/user/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: arena-user
    ports:
      - "5168:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Server=mysql-user;Port=3306;Database=arena_user_db;Uid=arena;Pwd=arena_password;
      - JwtSettings__Secret=${JWT_SECRET:-Arena_Secret_Key_For_Jwt_Token_Signing_2026_SE3022_Production_Grade!}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
    depends_on:
      mysql-user:
        condition: service_healthy

  stream:
    build:
      context: .
      dockerfile: services/stream/Dockerfile
    container_name: arena-stream
    ports:
      - "5167:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=arena_stream_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET:-Arena_Secret_Key_For_Jwt_Token_Signing_2026_SE3022_Production_Grade!}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: arena-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: arena_stream_db
    ports:
      - "3309:3306"
    volumes:
      - ./services/stream/src/Migrations/01_create_stream_db.sql:/docker-entrypoint-initdb.d/01_create_stream_db.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-tournament:
    image: mysql:8.0
    container_name: arena-mysql-tournament
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_tournament_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-tournament-data:/var/lib/mysql
      - ./services/tournament/src/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  tournament:
    build:
      context: .
      dockerfile: services/tournament/Dockerfile
    container_name: arena-tournament
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql-tournament;Port=3306;Database=arena_tournament_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET:-Arena_Secret_Key_For_Jwt_Token_Signing_2026_SE3022_Production_Grade!}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      mysql-tournament:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    container_name: arena-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  mysql-chat:
    image: mysql:8.0
    container_name: arena-mysql-chat
    ports:
      - "3310:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_chat_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-chat-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: arena-chat
    ports:
      - "5169:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ChatDb=Server=mysql-chat;Port=3306;Database=arena_chat_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET:-Arena_Secret_Key_For_Jwt_Token_Signing_2026_SE3022_Production_Grade!}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=chat-service-team-cache
    depends_on:
      mysql-chat:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: ./client/arena-web
      dockerfile: Dockerfile
    container_name: arena-web
    ports:
      - "5173:80"
    depends_on:
      - user
      - tournament
      - stream
      - chat

volumes:
  mysql-user-data:
  mysql-tournament-data:
  mysql-chat-data:
