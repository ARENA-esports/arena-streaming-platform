services:
  # ── MySQL: User service — dedicated database ────────────────────────────────
  # Provisions arena_user_db via MYSQL_DATABASE env var.
  # DbUp in the user service creates all tables at startup.
  mysql-user:
    image: mysql:8.0
    container_name: arena-mysql-user
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_user_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-user-data:/var/lib/mysql
      - ./services/user/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MySQL: Stream + Tournament — shared container, isolated logical databases
  # Provisions arena_stream_db and arena_tournament_db via init.sql.
  # DbUp in each service creates its own tables at startup.
  mysql:
    image: mysql:8.0
    container_name: arena-mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── User Service ────────────────────────────────────────────────────────────
  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: arena-user
    restart: on-failure
    ports:
      - "5168:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Server=mysql-user;Port=3306;Database=arena_user_db;Uid=arena;Pwd=arena_password;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql-user:
        condition: service_healthy

  # ── Stream Service ──────────────────────────────────────────────────────────
  stream:
    build:
      context: .
      dockerfile: services/stream/Dockerfile
    container_name: arena-stream
    restart: on-failure
    ports:
      - "5167:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=arena_stream_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-rootpassword};AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

  # ── Tournament Service ──────────────────────────────────────────────────────
  tournament:
    build:
      context: .
      dockerfile: services/tournament/Dockerfile
    container_name: arena-tournament
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=arena_tournament_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-rootpassword};AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Cors__AllowedOrigins__0=http://localhost:5173
    volumes:
      # Persist team logo uploads across container restarts
      - tournament-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # ── Web (Nginx + React SPA) ─────────────────────────────────────────────────
  web:
    build:
      context: ./client/arena-web
      dockerfile: Dockerfile
    container_name: arena-web
    ports:
      - "5173:80"
    volumes:
      # Overrides container nginx.conf with local proxy routes during local runs:
      - ./client/arena-web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user
      - tournament
      - stream
    # ── Kafka Event Broker ──────────────────────────────────────────────────────
    # ── Kafka Event Broker ──────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: arena-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 5s
      timeout: 5s
      retries: 10
  # ── One-Shot Topic Initializer ──────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: arena-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic stream.lifecycle &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic team.events"

volumes:
  mysql-user-data:
  mysql-data:
  tournament-uploads:
