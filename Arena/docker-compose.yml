services:
  # ── MySQL: User service database ───────────────────────────────────────────
  mysql-user:
    image: mysql:8.0
    container_name: arena-mysql-user
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_user_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-user-data:/var/lib/mysql
      - ./services/user/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MySQL: Stream + Tournament shared database ─────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: arena-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── User Service ───────────────────────────────────────────────────────────
  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: arena-user
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Server=mysql-user;Port=3306;Database=arena_user_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql-user:
        condition: service_healthy

  # ── Stream Service ─────────────────────────────────────────────────────────
  stream:
    build:
      context: .
      dockerfile: services/stream/Dockerfile
    container_name: arena-stream
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=arena_stream_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-rootpassword};AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

  # ── Tournament Service ─────────────────────────────────────────────────────
  tournament:
    build:
      context: .
      dockerfile: services/tournament/Dockerfile
    container_name: arena-tournament
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=arena_tournament_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-rootpassword};AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-user-data:
  mysql-data:
