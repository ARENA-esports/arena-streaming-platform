services:
  mysql-user:
    image: mysql:8.0
    container_name: arena-mysql-user
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_user_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-user-data:/var/lib/mysql
      - ./services/user/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: arena-user
    restart: on-failure
    ports:
      - "5168:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UserDb=Server=mysql-user;Port=3306;Database=arena_user_db;Uid=arena;Pwd=arena_password;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
    depends_on:
      mysql-user:
        condition: service_healthy

  stream:
    build:
      context: .
      dockerfile: services/stream/Dockerfile
    container_name: arena-stream
    restart: on-failure
    ports:
      - "5167:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=arena_stream_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: arena-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: arena_stream_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-stream-data:/var/lib/mysql
      - ./services/stream/src/Migrations/01_create_stream_db.sql:/docker-entrypoint-initdb.d/01_create_stream_db.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-tournament:
    image: mysql:8.0
    container_name: arena-mysql-tournament
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_tournament_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-tournament-data:/var/lib/mysql
      - ./services/tournament/src/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  tournament:
    build:
      context: .
      dockerfile: services/tournament/Dockerfile
    container_name: arena-tournament
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql-tournament;Port=3306;Database=arena_tournament_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
    depends_on:
      mysql-tournament:
        condition: service_healthy

  mysql-battle:
    image: mysql:8.0
    container_name: arena-mysql-battle
    ports:
      - "3310:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_battle_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-battle-data:/var/lib/mysql
      - ./services/battle/src/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: arena-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — no ZooKeeper required
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Two listeners: PLAINTEXT_HOST for host access, PLAINTEXT for Docker-internal
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: arena-kafka-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  battle:
    build:
      context: .
      dockerfile: services/battle/Dockerfile
    container_name: arena-battle
    restart: on-failure
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql-battle;Port=3306;Database=arena_battle_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      # SCRUM-118: override StreamService BaseUrl for Docker Compose internal networking
      - StreamService__BaseUrl=http://stream:8080
      # SCRUM-117: Kafka internal Docker bootstrap address (overrides localhost:9092 default)
      - Kafka__BootstrapServers=kafka:29092
    depends_on:
      mysql-battle:
        condition: service_healthy
      stream:
        condition: service_started
      kafka:
        condition: service_healthy

  # ── Chat Service ────────────────────────────────────────────────────────────
  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: arena-chat
    restart: on-failure
    ports:
      - "5170:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ChatDb=Server=mysql;Port=3306;Database=arena_chat_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-rootpassword};AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__GroupId=chat-service-team-cache
      - Kafka__Topic=team.events
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Analytics MySQL Database (SCRUM-125) ────────────────────────────────────
  mysql-analytics:
    image: mysql:8.0
    container_name: arena-mysql-analytics
    ports:
      - "3311:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=arena_analytics_db
      - MYSQL_USER=arena
      - MYSQL_PASSWORD=arena_password
    volumes:
      - mysql-analytics-data:/var/lib/mysql
      - ./services/analytics/src/Migrations/001_create_analytics_tables.sql:/docker-entrypoint-initdb.d/001_create_analytics_tables.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Analytics Microservice (SCRUM-125) ──────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: arena-analytics
    restart: on-failure
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql-analytics;Port=3306;Database=arena_analytics_db;Uid=root;Pwd=rootpassword;AllowUserVariables=True;
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Arena.UserService
      - JwtSettings__Audience=Arena.Platform
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__GroupId=analytics-service-engagement
      - Kafka__CoinEarnedTopic=coin.earned
      - Analytics__DefaultWatchTickDurationSeconds=60
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      mysql-analytics:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── One-Shot Topic Initializer ──────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: arena-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic stream.lifecycle &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic team.events &&
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic coin.earned"

  web:
    build:
      context: ./client/arena-web
      dockerfile: Dockerfile
    container_name: arena-web
    ports:
      - "5173:80"
    volumes:
      - ./client/arena-web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user
      - tournament
      - stream
      - battle
      - chat
      - analytics

volumes:
  mysql-stream-data:
  mysql-user-data:
  mysql-tournament-data:
  mysql-battle-data:
  mysql-analytics-data:
  kafka-data:
