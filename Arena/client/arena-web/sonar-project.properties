# SonarCloud configuration for ARENA Frontend
sonar.projectKey=arena-esports_arena-frontend
sonar.organization=arena-esports

# Project Identification
sonar.projectName=arena-streaming-platform-frontend
sonar.projectVersion=1.0.0

# Source and Test Locations
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,src/**/*.test.ts,src/**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.jmx,*.config.*,scratch/**,public/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,tests/**,src/main.tsx,vite.config.ts,vite.config.js,tailwind.config.js,postcss.config.js,eslint.config.js

# Test & Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
