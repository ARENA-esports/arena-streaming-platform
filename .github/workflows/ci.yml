name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# FIX: Prefixed with "ci-" so this doesn't collide with cd-staging.yml
# which also triggers on dev push. Without prefix, they cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: detect which services changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      stream: ${{ steps.filter.outputs.stream }}
      tournament: ${{ steps.filter.outputs.tournament }}
      chat: ${{ steps.filter.outputs.chat }}
      battle: ${{ steps.filter.outputs.battle }}
      analytics: ${{ steps.filter.outputs.analytics }}
      backend_any: ${{ steps.filter.outputs.backend_any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'Arena/services/user/**'
              - 'Arena/shared/EventContracts/**'
            stream:
              - 'Arena/services/stream/**'
              - 'Arena/shared/EventContracts/**'
            tournament:
              - 'Arena/services/tournament/**'
              - 'Arena/shared/EventContracts/**'
            chat:
              - 'Arena/services/chat/**'
              - 'Arena/shared/EventContracts/**'
            battle:
              - 'Arena/services/battle/**'
              - 'Arena/shared/EventContracts/**'
            analytics:
              - 'Arena/services/analytics/**'
              - 'Arena/shared/EventContracts/**'
            backend_any:
              - 'Arena/services/**'
              - 'Arena/shared/**'
              - 'Arena/Arena.slnx'

  # Job 2: build + test + analyze User (only if changed)
  build-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Restore
        run: dotnet restore Arena/services/user/tests/UserService.Tests.csproj

      - name: Build
        run: dotnet build Arena/services/user/tests/UserService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Arena/services/user/tests/UserService.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # Job 3: build + test + analyze Stream
  build-stream:
    needs: detect-changes
    if: needs.detect-changes.outputs.stream == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Restore
        run: dotnet restore Arena/services/stream/tests/StreamService.Tests.csproj

      - name: Build
        run: dotnet build Arena/services/stream/tests/StreamService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Arena/services/stream/tests/StreamService.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stream-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
  
  # Job 4: build + test + analyze Tournament
  build-tournament:
    needs: detect-changes
    if: needs.detect-changes.outputs.tournament == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      
      - name: Restore
        run: dotnet restore Arena/services/tournament/tests/TournamentService.Tests.csproj

      - name: Build
        run: dotnet build Arena/services/tournament/tests/TournamentService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Arena/services/tournament/tests/TournamentService.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
 
  # Job 5: build + test + analyze Chat
  build-chat:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    permissions: 
      actions: read
      contents: read
      security-events: write
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with: 
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Initialize CodeQL 
        uses: github/codeql-action/init@v3
        with: 
          languages: csharp
      
      - name: Restore 
        run: dotnet restore Arena/services/chat/tests/ChatService.Tests.csproj
      
      - name: Build 
        run: dotnet build Arena/services/chat/tests/ChatService.Tests.csproj --no-restore --configuration Release

      - name: Test 
        run: dotnet test Arena/services/chat/tests/ChatService.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with: 
          name: chat-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

      - name: Perform CodeQL Analysis 
        uses: github/codeql-action/analyze@v3
        with: 
          category: "/language:csharp"

  # Job 6: build + test + analyze Battle
  build-battle:
    needs: detect-changes
    if: needs.detect-changes.outputs.battle == 'true'
    runs-on: ubuntu-latest
    permissions: 
      actions: read
      contents: read
      security-events: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: arena_battle_db
          MYSQL_USER: arena
          MYSQL_PASSWORD: arena_password
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps: 
      - uses: actions/checkout@v4

      - name: Apply Database Migrations
        run: |
          until MYSQL_PWD=arena_password mysqladmin ping -h 127.0.0.1 -P 3310 -u arena --silent; do
            echo "Waiting for MySQL to become ready..."
            sleep 2
          done
          for file in Arena/services/battle/src/Migrations/*.sql; do
            echo "Applying $file..."
            MYSQL_PWD=arena_password mysql -h 127.0.0.1 -P 3310 -u arena arena_battle_db < "$file"
          done

      - uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with: 
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Initialize CodeQL 
        uses: github/codeql-action/init@v3
        with: 
          languages: csharp
      
      - name: Restore 
        run: dotnet restore Arena/services/battle/tests/BattleEconomyService.Tests.csproj
      
      - name: Build 
        run: dotnet build Arena/services/battle/tests/BattleEconomyService.Tests.csproj --no-restore --configuration Release

      - name: Test 
        run: dotnet test Arena/services/battle/tests/BattleEconomyService.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with: 
          name: battle-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

      - name: Perform CodeQL Analysis 
        uses: github/codeql-action/analyze@v3
        with: 
          category: "/language:csharp"

  # Job 7: build + test + analyze Analytics
  build-analytics:
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    permissions: 
      actions: read
      contents: read
      security-events: write
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with: 
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Initialize CodeQL 
        uses: github/codeql-action/init@v3
        with: 
          languages: csharp
      
      - name: Restore 
        run: dotnet restore Arena/services/analytics/tests/AnalyticsService.Tests.csproj
      
      - name: Build 
        run: dotnet build Arena/services/analytics/tests/AnalyticsService.Tests.csproj --no-restore --configuration Release

      - name: Test 
        run: dotnet test Arena/services/analytics/tests/AnalyticsService.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with: 
          name: analytics-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

      - name: Perform CodeQL Analysis 
        uses: github/codeql-action/analyze@v3
        with: 
          category: "/language:csharp"

  # Job 8: SonarCloud Backend Analysis
  sonarcloud-backend:
    name: SonarCloud Backend Analysis
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_any == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: arena_battle_db
          MYSQL_USER: arena
          MYSQL_PASSWORD: arena_password
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Apply Battle Database Migrations
        run: |
          until MYSQL_PWD=arena_password mysqladmin ping -h 127.0.0.1 -P 3310 -u arena --silent; do
            echo "Waiting for MySQL to become ready..."
            sleep 2
          done
          for file in Arena/services/battle/src/Migrations/*.sql; do
            echo "Applying $file..."
            MYSQL_PWD=arena_password mysql -h 127.0.0.1 -P 3310 -u arena arena_battle_db < "$file"
          done

      - name: SonarCloud Begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"arena-esports_arena-backend" \
            /o:"arena-esports" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.cobertura.reportsPaths="**/TestResults/**/coverage.cobertura.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**,**/tests/**,**/*.Tests/**" \
            /d:sonar.coverage.exclusions="**/tests/**,**/*.Tests/**,**/Migrations/**"

      - name: Restore Backend Solution
        run: dotnet restore Arena/Arena.slnx

      - name: Build Backend Solution
        run: dotnet build Arena/Arena.slnx --no-restore --configuration Release

      - name: Test Backend with Coverage
        run: dotnet test Arena/Arena.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: SonarCloud End
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  
