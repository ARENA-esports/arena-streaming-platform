name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # Job 1: detect which services changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      stream: ${{ steps.filter.outputs.stream }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'services/user/**'
              - 'shared/EventContracts/**'
            stream:
              - 'services/stream/**'
              - 'shared/EventContracts/**'

  # Job 2: build + test User (only if changed)
  build-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore services/user/src/UserService.csproj
      - name: Build
        run: dotnet build services/user/src/UserService.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test services/user/tests/UserService.Tests.csproj --no-restore --configuration Release

  # Job 3: build + test Stream (only if changed)
  build-stream:
    needs: detect-changes
    if: needs.detect-changes.outputs.stream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore services/stream/src/StreamService.csproj
      - name: Build
        run: dotnet build services/stream/src/StreamService.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test services/stream/tests/StreamService.Tests.csproj --no-restore --configuration Release