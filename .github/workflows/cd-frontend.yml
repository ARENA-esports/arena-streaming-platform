name: CD Frontend

on:
  push:
    branches: [main]
    paths:
      - 'Arena/client/arena-web/**'
  workflow_dispatch:

concurrency:
  group: deploy-arena-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena/client/arena-web
          file: ./Arena/client/arena-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-frontend:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-frontend:${{ github.sha }}
          build-args: |
            VITE_USER_API_URL=${{ vars.VITE_USER_API_URL }}
            VITE_STREAM_API_URL=${{ vars.VITE_STREAM_API_URL }}
            VITE_TOURNAMENT_API_URL=${{ vars.VITE_TOURNAMENT_API_URL }}
            VITE_CHAT_API_URL=${{ vars.VITE_CHAT_API_URL }}
            VITE_BATTLE_API_URL=${{ vars.VITE_BATTLE_API_URL }}
            VITE_APP_DOMAIN=${{ vars.VITE_APP_DOMAIN }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-frontend:${{ github.sha }}
