name: CD

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      stream: ${{ steps.filter.outputs.stream }}
      tournament: ${{ steps.filter.outputs.tournament }}
      chat: ${{ steps.filter.outputs.chat }}
      battle: ${{ steps.filter.outputs.battle }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'Arena/services/user/**'
              - 'Arena/shared/EventContracts/**'
            stream:
              - 'Arena/services/stream/**'
              - 'Arena/shared/EventContracts/**'
            tournament:
              - 'Arena/services/tournament/**'
              - 'Arena/shared/EventContracts/**'
            chat:
              - 'Arena/services/chat/**'
              - 'Arena/shared/EventContracts/**'
            battle:
              - 'Arena/services/battle/**'
              - 'Arena/shared/EventContracts/**'

  deploy-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-user
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/user/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-user:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-user:${{ github.sha }}
          cache-from: type=gha,scope=user
          cache-to: type=gha,mode=max,scope=user

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-user
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_USER }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-user:${{ github.sha }}

  deploy-stream:
    needs: detect-changes
    if: needs.detect-changes.outputs.stream == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-stream
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/stream/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-stream:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-stream:${{ github.sha }}
          cache-from: type=gha,scope=stream
          cache-to: type=gha,mode=max,scope=stream

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-stream
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STREAM }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-stream:${{ github.sha }}

  deploy-tournament:
    needs: detect-changes
    if: needs.detect-changes.outputs.tournament == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-tournament
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/tournament/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-tournament:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-tournament:${{ github.sha }}
          cache-from: type=gha,scope=tournament
          cache-to: type=gha,mode=max,scope=tournament

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-tournament
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TOURNAMENT }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-tournament:${{ github.sha }}

  deploy-chat:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-chat
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/chat/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-chat:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-chat:${{ github.sha }}
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-chat
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CHAT }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-chat:${{ github.sha }}

  deploy-battle:
    needs: detect-changes
    if: needs.detect-changes.outputs.battle == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-battle
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/battle/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-battle:latest
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-battle:${{ github.sha }}
          cache-from: type=gha,scope=battle
          cache-to: type=gha,mode=max,scope=battle

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-battle
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BATTLE }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-battle:${{ github.sha }}

