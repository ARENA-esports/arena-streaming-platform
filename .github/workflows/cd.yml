name: CD

on:
  push:
    branches: [main]

jobs:
  # Job 1: detect which services changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      stream: ${{ steps.filter.outputs.stream }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'Arena/services/user/**'
              - 'Arena/shared/EventContracts/**'
            stream:
              - 'Arena/services/stream/**'
              - 'Arena/shared/EventContracts/**'

  # Job 2: build, push, deploy User (only if changed)
  deploy-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/user/Dockerfile
          push: true
          tags: |
            ghcr.io/arena-esports/arena-user:latest
            ghcr.io/arena-esports/arena-user:${{ github.sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-user
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_USER }}
          images: ghcr.io/arena-esports/arena-user:${{ github.sha }}

  # Job 3: build, push, deploy Stream (only if changed)
  deploy-stream:
    needs: detect-changes
    if: needs.detect-changes.outputs.stream == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/stream/Dockerfile
          push: true
          tags: |
            ghcr.io/arena-esports/arena-stream:latest
            ghcr.io/arena-esports/arena-stream:${{ github.sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-stream
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STREAM }}
          images: ghcr.io/arena-esports/arena-stream:${{ github.sha }}
