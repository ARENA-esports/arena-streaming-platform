name: CD Staging

on:
  push:
    branches: [dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      stream: ${{ steps.filter.outputs.stream }}
      tournament: ${{ steps.filter.outputs.tournament }}
      chat: ${{ steps.filter.outputs.chat }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'Arena/services/user/**'
              - 'Arena/shared/EventContracts/**'
            stream:
              - 'Arena/services/stream/**'
              - 'Arena/shared/EventContracts/**'
            tournament:
              - 'Arena/services/tournament/**'
              - 'Arena/shared/EventContracts/**'
            chat:
              - 'Arena/services/chat/**'
              - 'Arena/shared/EventContracts/**'

  deploy-user-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-user-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/user/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-user:staging
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-user:staging-${{ github.sha }}
          cache-from: type=gha,scope=user-staging
          cache-to: type=gha,mode=max,scope=user-staging

      - name: Deploy to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-user-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_USER_STAGING }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-user:staging-${{ github.sha }}

  deploy-stream-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.stream == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-stream-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/stream/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-stream:staging
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-stream:staging-${{ github.sha }}
          cache-from: type=gha,scope=stream-staging
          cache-to: type=gha,mode=max,scope=stream-staging

      - name: Deploy to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-stream-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STREAM_STAGING }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-stream:staging-${{ github.sha }}

  deploy-tournament-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.tournament == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-tournament-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/tournament/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-tournament:staging
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-tournament:staging-${{ github.sha }}
          cache-from: type=gha,scope=tournament-staging
          cache-to: type=gha,mode=max,scope=tournament-staging

      - name: Deploy to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-tournament-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TOURNAMENT_STAGING }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-tournament:staging-${{ github.sha }}

  deploy-chat-staging:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-arena-chat-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Arena
          file: ./Arena/services/chat/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-chat:staging
            ghcr.io/${{ steps.lower.outputs.owner }}/arena-chat:staging-${{ github.sha }}
          cache-from: type=gha,scope=chat-staging
          cache-to: type=gha,mode=max,scope=chat-staging

      - name: Deploy to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: arena-chat-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CHAT_STAGING }}
          images: ghcr.io/${{ steps.lower.outputs.owner }}/arena-chat:staging-${{ github.sha }}
