name: CI Frontend

on:
  push:
    branches: [dev]
    paths:
      - 'Arena/client/arena-web/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'Arena/client/arena-web/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Arena/client/arena-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Arena/client/arena-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
